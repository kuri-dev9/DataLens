<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DataLens PoC</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f6fa; --panel:#fff; --text:#172033; --muted:#697386; --line:#dce1ea; --brand:#6558d3; --brand2:#3b82f6; --soft:#eef1ff; --danger:#c0353d; --shadow:0 24px 70px #1720332b; }
    @media(prefers-color-scheme:dark){:root{--bg:#111522;--panel:#1a2030;--text:#eef2ff;--muted:#9ba5b7;--line:#31394d;--soft:#28284d;--danger:#ff7b82;--shadow:0 24px 70px #0008}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif} button,input{font:inherit} button{cursor:pointer}
    .work{min-height:100vh;padding:clamp(28px,7vw,90px);background:radial-gradient(circle at 20% 10%,#6558d31c,transparent 35%),var(--bg)}
    .work h1{font-size:clamp(28px,5vw,56px);max-width:700px;margin:0 0 18px;letter-spacing:-.04em}.work p{color:var(--muted);max-width:620px;font-size:17px}
    .debug-console{max-width:min(900px,calc(100vw - 48px));margin-top:35px;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}.debug-bar{display:flex;align-items:center;gap:8px;padding:11px 13px}.debug-bar h2{font-size:14px;margin:0}.debug-actions{margin-left:auto;display:flex;gap:6px}.debug-body{border-top:1px solid var(--line);max-height:62vh;overflow:auto;padding:10px}.debug-console.collapsed .debug-body{display:none}.debug-entry{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden}.debug-entry>summary{cursor:pointer;padding:9px 11px;background:var(--bg);font-weight:650}.debug-section{padding:8px 11px;border-top:1px solid var(--line)}.debug-section summary{cursor:pointer}.debug-section pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.45 ui-monospace,monospace;color:var(--muted)}.debug-timeline{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font:11px ui-monospace,monospace}.debug-empty{padding:20px;color:var(--muted);text-align:center}.interrupted{display:inline-block;margin-top:8px;padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger);font-size:11px;font-weight:700}
    .ai-fab{position:fixed;left:24px;bottom:24px;border:0;border-radius:999px;padding:15px 20px;color:white;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:var(--shadow);font-weight:750;z-index:20}.ai-fab[aria-expanded=true]{transform:scale(.96)}
    .panel{position:fixed;inset:0 0 0 auto;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .28s ease;z-index:15;display:flex;flex-direction:column}.panel.open{transform:none}
    .tabs{height:58px;display:flex;align-items:end;padding:0 14px;border-bottom:1px solid var(--line);gap:5px}.tab{border:0;border-radius:10px 10px 0 0;padding:12px 16px;background:transparent;color:var(--muted)}.tab.active{background:var(--soft);color:var(--text);font-weight:750}.tab:disabled{opacity:.55;cursor:not-allowed}.spacer{flex:1}.icon{border:0;background:transparent;color:var(--muted);font-size:18px;padding:10px}
    .toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}.pill{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);padding:6px 10px}.pill.active{background:var(--brand);border-color:var(--brand);color:#fff}.session-time{margin-left:auto;color:var(--muted);font-size:12px}
    .views{flex:1;min-height:0;position:relative}.view{position:absolute;inset:0;display:none;overflow:auto;padding:16px}.view.active{display:block}.messages{display:flex;flex-direction:column;gap:12px}.bubble{max-width:88%;padding:11px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:var(--brand);color:white;border-bottom-right-radius:4px}.bubble.assistant{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}.progress{color:var(--muted);font-size:12px;margin:3px 0}.metrics{color:var(--muted);font-size:11px;margin-top:7px}.error{border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent)}
    .composer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:11px}.primary{border:0;border-radius:11px;padding:10px 15px;background:var(--brand);color:white;font-weight:700}.danger{background:var(--danger)}.notice{padding:8px 14px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
    .dataset{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}.dataset-head{display:flex;gap:8px;align-items:center;padding:9px 11px;background:var(--bg)}.dataset-head b{overflow:hidden;text-overflow:ellipsis}.dataset-head span{color:var(--muted);font-size:12px}.table-wrap{overflow:auto;max-height:330px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--panel);z-index:1}.more{margin:9px}
    .catalog-head{display:flex;gap:8px;margin-bottom:12px}.catalog-head input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--bg);color:var(--text)}.table-item{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:10px;text-align:left}.badge{font-size:10px;border-radius:999px;padding:2px 6px;background:var(--soft);color:var(--brand)}.columns{padding:5px 12px 12px;color:var(--muted)}
    dialog{border:0;border-radius:18px;padding:0;background:var(--panel);color:var(--text);box-shadow:var(--shadow);width:min(430px,calc(100vw - 28px))}dialog::backdrop{background:#0b102080}.modal{padding:24px}.modal h2{margin:0 0 8px}.modal p{color:var(--muted)}.field{display:block;margin:14px 0}.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--text)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    @media(max-width:700px){.panel{width:100%}.ai-fab{left:14px;bottom:14px}.work{padding:35px 22px}.debug-console{max-width:100%}}
  </style>
</head>
<body>
  <main class="work"><p>DataLens PoC 관찰 도구</p><h1>API 요청과 스트림을 직접 확인하세요.</h1><p>좌하단 AI 패널을 사용하면 아래 콘솔에 요청, SSE 이벤트, 타임라인과 집계가 기록됩니다.</p><section id="debugConsole" class="debug-console collapsed"><header class="debug-bar"><button id="debugToggle" class="pill" aria-expanded="false">▸ 디버그 콘솔</button><h2>최신 요청이 위에 표시됩니다</h2><div class="debug-actions"><button id="copyLogs" class="pill">전체 JSON 복사</button><button id="clearLogs" class="pill">비우기</button></div></header><div id="debugBody" class="debug-body"><div class="debug-empty">아직 요청이 없습니다.</div></div></section></main>
  <button id="aiFab" class="ai-fab" aria-expanded="false">🤖 AI</button>
  <aside id="panel" class="panel" aria-label="AI 패널">
    <header class="tabs"><button class="tab active">DataLens</button><button class="tab" disabled>＋ 준비 중</button><span class="spacer"></span><button id="settingsBtn" class="icon" title="설정">⚙</button><button id="closeBtn" class="icon" title="닫기">×</button></header>
    <div class="toolbar"><button id="koBtn" class="pill active">한국어</button><button id="jaBtn" class="pill">日本語</button><button id="newBtn" class="pill">새 대화</button><button id="catalogBtn" class="pill">테이블</button><span id="sessionTime" class="session-time">세션 없음</span></div>
    <div class="views"><section id="chatView" class="view active"><div id="messages" class="messages"></div></section><section id="catalogView" class="view"><div class="catalog-head"><input id="catalogSearch" placeholder="테이블 검색"><button id="backBtn" class="pill">대화</button></div><div id="catalogList"></div></section></div>
    <form id="composer" class="composer"><input id="messageInput" autocomplete="off" placeholder="질문을 입력하세요"><button id="sendBtn" class="primary">전송</button><button id="cancelBtn" type="button" class="primary danger" hidden>취소</button></form>
    <div class="notice">PoC 데모: 이력은 브라우저 세션에만 저장되며 새로고침 시 유지, 탭을 닫으면 사라집니다. 실서비스에서는 서버 측 영속화가 필요합니다.</div>
  </aside>
  <dialog id="settingsDialog"><form id="settingsForm" class="modal"><h2>DataLens 연결 설정</h2><p>API 키는 이 브라우저 탭의 sessionStorage에만 보관됩니다.</p><label class="field"><span>Base URL</span><input id="baseInput" type="url" required value="http://192.168.100.223:18121"></label><label class="field"><span>API key</span><input id="keyInput" type="password" required autocomplete="off"></label><div class="modal-actions"><button id="modalCancel" type="button" class="pill">취소</button><button class="primary">저장</button></div></form></dialog>
  <script>
  (() => {
    "use strict";
    // Agent 확장 지점: 탭마다 config/session/history/controller를 독립 보관한다.
    const agents = {
      datalens: {id:"datalens", label:"DataLens", base:"http://192.168.100.223:18121", apiKey:"", locale:"ko", session:null, history:[], datasets:[], controller:null}
    };
    let active = agents.datalens, lastRetry = null, catalogRows = [], debugLogs = [], debugOpen = false, debugFrame = 0;
    const $ = id => document.getElementById(id);
    const storageKey = suffix => `datalens-demo:${active.id}:${suffix}`;
    const safeText = value => String(value ?? "");
    const errorMessages = {
      DL_INVALID_REQUEST:"요청 형식을 확인해 주세요.", DL_INVALID_LOCALE:"지원 언어는 한국어와 일본어입니다.", DL_INVALID_PAGINATION:"페이지 범위를 확인해 주세요.",
      DL_UNAUTHORIZED:"API 키가 올바르지 않습니다. 설정을 확인해 주세요.", DL_SESSION_NOT_FOUND:"세션이 만료되어 새로 연결합니다.", DL_DATASET_NOT_FOUND:"데이터가 만료되었습니다. 다시 질문해 주세요.",
      DL_CATALOG_NOT_FOUND:"테이블을 찾을 수 없거나 접근할 수 없습니다.", DL_SESSION_BUSY:"이전 요청을 처리 중입니다.", DL_INTERNAL_ERROR:"서버 오류가 발생했습니다.",
      DL_CATALOG_UNAVAILABLE:"카탈로그 서비스에 연결할 수 없습니다.", DL_UPSTREAM_UNAVAILABLE:"데이터 서비스에 연결할 수 없습니다.", DL_UPSTREAM_TIMEOUT:"처리 시간이 초과되었습니다.",
      DL_AGENT_LIMIT:"질문을 더 구체적으로 입력해 주세요.", DL_AGENT_INVALID_TOOL:"요청 처리에 실패했습니다. 다시 시도해 주세요.", DL_AGENT_NOT_READY:"AI가 아직 준비되지 않았습니다.",
      DL_QUERY_REJECTED:"데이터 요청을 처리하지 못했습니다.", DL_UPSTREAM_INVALID_RESPONSE:"서비스 응답을 처리할 수 없습니다."
    };
    function maskedHeaders(values){const copy={...values};if(copy["x-api-key"])copy["x-api-key"]=`${copy["x-api-key"].slice(0,6)}…`;return copy;}
    function debugSave(){sessionStorage.setItem(storageKey("debug"),JSON.stringify({open:debugOpen,logs:debugLogs}));}
    function debugStart(method,url,requestHeaders,body,mode="json"){const entry={id:`req_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,startedAt:new Date().toISOString(),startedPerf:performance.now(),mode,request:{method,url,headers:maskedHeaders(requestHeaders),body:body??null},events:[],timeline:[],aggregate:{ttft_ms:null,total_ms:null,token_count:0,tool_calls:0,tokens_per_second:null},response:null,error:null};debugLogs.unshift(entry);debugLogs=debugLogs.slice(0,50);debugSave();debugRender();return entry;}
    function debugEvent(entry,name,data,raw=null){const now=performance.now();if(name==="start"&&!entry.streamStartPerf)entry.streamStartPerf=now;const elapsed=Math.round(now-(entry.streamStartPerf??entry.startedPerf)),receivedAt=new Date().toISOString();entry.events.push({received_at:receivedAt,elapsed_ms:elapsed,event:name,data,raw:raw??JSON.stringify(data)});entry.timeline.push({event:name,elapsed_ms:elapsed});if(name==="token"){entry.aggregate.token_count++;if(entry.aggregate.ttft_ms===null){entry.aggregate.ttft_ms=elapsed;entry.firstTokenPerf=now;}}if(name==="tool_call"&&data?.status==="started")entry.aggregate.tool_calls++;debugSave();if(name==="token"){if(!debugFrame)debugFrame=requestAnimationFrame(()=>{debugFrame=0;debugRender();});}else debugRender();}
    function debugFinish(entry,response,error=null){const now=performance.now(),total=Math.round(now-entry.startedPerf);entry.aggregate.total_ms=total;const generation=Math.max(1,now-(entry.firstTokenPerf??now));entry.aggregate.tokens_per_second=Number((entry.aggregate.token_count/(generation/1000)).toFixed(2));entry.response=response??null;entry.error=error?{code:error?.error?.code||error?.code||"NETWORK_ERROR",message:error?.error?.message||error?.message||"",retryable:error?.error?.retryable??false,details:error?.error?.details??null}:null;debugSave();debugRender();}
    function esc(value){return safeText(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));}
    function debugRender(){const root=$("debugBody");root.textContent="";if(!debugLogs.length){root.innerHTML='<div class="debug-empty">아직 요청이 없습니다.</div>';return;}debugLogs.forEach((entry,index)=>{const details=document.createElement("details");details.className="debug-entry";if(index===0)details.open=true;const tokens=entry.events.filter(event=>event.event==="token"),others=entry.events.filter(event=>event.event!=="token");details.innerHTML=`<summary>${esc(entry.request.method)} ${esc(entry.request.url)} · ${entry.aggregate.total_ms??"진행 중"}ms</summary><div class="debug-section"><b>요청</b><pre>${esc(JSON.stringify(entry.request,null,2))}</pre></div><details class="debug-section"><summary>SSE 이벤트 ${entry.events.length}건 (token ${tokens.length}건)</summary><pre>${esc(JSON.stringify(others,null,2))}</pre><details><summary>token 이벤트 ${tokens.length}건 펼치기</summary><pre>${esc(JSON.stringify(tokens,null,2))}</pre></details></details><div class="debug-section"><b>타임라인</b><div class="debug-timeline">${entry.timeline.map(item=>`<span>+${item.elapsed_ms}ms</span><span>${esc(item.event)}</span>`).join("")||"—"}</div></div><div class="debug-section"><b>집계</b><pre>${esc(JSON.stringify(entry.aggregate,null,2))}</pre></div><details class="debug-section"><summary>최종 응답 원문</summary><pre>${esc(JSON.stringify(entry.response,null,2))}</pre></details>${entry.error?`<div class="debug-section error"><b>오류</b><pre>${esc(JSON.stringify(entry.error,null,2))}</pre></div>`:""}`;root.append(details);});}
    async function copyLogs(){const text=JSON.stringify(debugLogs,null,2);try{await navigator.clipboard.writeText(text);}catch{const area=document.createElement("textarea");area.value=text;document.body.append(area);area.select();document.execCommand("copy");area.remove();}$("copyLogs").textContent="복사됨";setTimeout(()=>$("copyLogs").textContent="전체 JSON 복사",1200);}
    function save(){sessionStorage.setItem(storageKey("config"),JSON.stringify({base:active.base,apiKey:active.apiKey,locale:active.locale,session:active.session}));sessionStorage.setItem(storageKey("history"),JSON.stringify(active.history));}
    function restore(){try{Object.assign(active,JSON.parse(sessionStorage.getItem(storageKey("config"))||"{}"));active.history=JSON.parse(sessionStorage.getItem(storageKey("history"))||"[]");const debug=JSON.parse(sessionStorage.getItem(storageKey("debug"))||"{}");debugLogs=debug.logs||[];debugOpen=Boolean(debug.open);}catch{}$("debugConsole").classList.toggle("collapsed",!debugOpen);$("debugToggle").setAttribute("aria-expanded",debugOpen);$("debugToggle").textContent=`${debugOpen?"▾":"▸"} 디버그 콘솔`;renderHistory();debugRender();updateLocale();updateExpiry();}
    function headers(extra={}){return {"x-api-key":active.apiKey,"content-type":"application/json",...extra};}
    async function api(path, options={}, retry=true){const url=active.base+path,requestHeaders={...headers(),...(options.headers||{})},method=options.method||"GET";let requestBody=options.body??null;try{if(typeof requestBody==="string")requestBody=JSON.parse(requestBody);}catch{}const log=debugStart(method,url,requestHeaders,requestBody,"json");try{const response=await fetch(url,{...options,headers:requestHeaders});let body=null;if(response.headers.get("content-type")?.includes("json"))body=await response.json();const raw={status:response.status,headers:Object.fromEntries(response.headers.entries()),body};if(!response.ok){debugFinish(log,raw,body);const code=body?.error?.code;if(code==="DL_SESSION_NOT_FOUND"&&retry){await createSession();return api(path.replace(/\/v1\/sessions\/[^/]+/,`/v1/sessions/${active.session.session_id}`),options,false);}throw Object.assign(new Error(code||"HTTP_ERROR"),{payload:body,status:response.status});}debugFinish(log,raw);return body;}catch(error){if(!log.response)debugFinish(log,null,error?.payload||{code:error.message,message:error.message});throw error;}}
    async function createSession(){if(!active.apiKey){openSettings();throw new Error("NO_CONFIG");}const body=await api("/v1/sessions",{method:"POST",body:JSON.stringify({locale:active.locale})},false);active.session=body;save();updateExpiry();return body;}
    async function ensureSession(){if(!active.session||Date.parse(active.session.expires_at)<=Date.now())await createSession();return active.session;}
    function openSettings(){ $("baseInput").value=active.base;$("keyInput").value=active.apiKey;$("settingsDialog").showModal(); }
    function addBubble(role,text=""){const box=document.createElement("div");box.className=`bubble ${role}`;box.textContent=text;$("messages").append(box);$("chatView").scrollTop=$("chatView").scrollHeight;return box;}
    const upstreamMessages={MISSING_PARTITION_SCOPE:"조회 범위 지정에 문제가 있습니다.",INVALID_PARTITION_SCOPE:"조회 범위 지정에 문제가 있습니다.",PARTITION_SCOPE_TOO_WIDE:"조회 기간이 보유 구간을 벗어났습니다.",UNKNOWN_TABLE:"해당 테이블을 찾을 수 없습니다.",UNKNOWN_COLUMN:"해당 컬럼을 찾을 수 없습니다.",TABLE_NOT_ALLOWED:"허용되지 않은 데이터 요청입니다.",COLUMN_NOT_ALLOWED:"허용되지 않은 데이터 요청입니다.",POLICY_VIOLATION:"허용되지 않은 데이터 요청입니다.",RESULT_TOO_LARGE:"결과가 너무 많습니다. 조건을 좁혀 주세요.",QUERY_TIMEOUT:"조회 시간이 초과되었습니다."};
    const errorPayload=error=>error?.payload||error||{};
    function queryRejectedMessage(error){const upstream=errorPayload(error)?.error?.details?.upstream_code||"";return upstreamMessages[upstream]||"데이터 요청을 처리하지 못했습니다.";}
    // 어느 단계에서 멈췄는지 보여준다. 앞서 확보한 결과는 지우지 않는다.
    function failureTrace(error){const payload=errorPayload(error),step=payload?.metadata?.failed_step||payload?.error?.details?.failed_step;if(!step)return "";const where=`${step.index}번째 도구 호출(${safeText(step.tool)})`;return step.upstream_code?`${where}에서 중단 · ${safeText(step.upstream_code)}`:`${where}에서 중단`;}
    function addError(error,retry,partial=false){const code=error?.payload?.error?.code||error?.error?.code||error?.message;const message=code==="DL_AGENT_LIMIT"&&partial?"답변 생성이 중단되었습니다. 이어서 질문해 주세요.":code==="DL_QUERY_REJECTED"?queryRejectedMessage(error):errorMessages[code]||"요청을 처리하지 못했습니다.";const box=addBubble("assistant error",message);const trace=failureTrace(error);if(trace){const note=document.createElement("div");note.className="metrics";note.textContent=trace;box.append(note);}const retryable=error?.payload?.error?.retryable||["DL_INTERNAL_ERROR","DL_CATALOG_UNAVAILABLE","DL_AGENT_INVALID_TOOL","DL_AGENT_NOT_READY","DL_UPSTREAM_INVALID_RESPONSE"].includes(code);if(retryable&&retry){const button=document.createElement("button");button.className="pill";button.textContent="재시도";button.onclick=retry;box.append(document.createElement("br"),button);}if(code==="DL_SESSION_BUSY")setBusy(true);return box;}
    function renderHistory(){$("messages").textContent="";active.history.forEach(item=>addBubble(item.role,item.text));}
    function setBusy(value){$("messageInput").disabled=value;$("sendBtn").hidden=value;$("cancelBtn").hidden=!value;}
    function updateLocale(){$("koBtn").classList.toggle("active",active.locale==="ko");$("jaBtn").classList.toggle("active",active.locale==="ja");}
    function updateExpiry(){if(!active.session){$("sessionTime").textContent="세션 없음";return;}const mins=Math.max(0,Math.ceil((Date.parse(active.session.expires_at)-Date.now())/60000));$("sessionTime").textContent=`세션 ${mins}분`;}
    async function newConversation(){if(active.controller)active.controller.abort();active.history=[];active.datasets=[];active.session=null;save();renderHistory();await createSession();}
    async function parseSse(response,onEvent,log){if(!response.ok){const body=await response.json();throw Object.assign(new Error(body?.error?.code||"HTTP_ERROR"),{payload:body,status:response.status});}const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true}).replace(/\r\n/g,"\n");const blocks=buffer.split("\n\n");buffer=blocks.pop()||"";for(const block of blocks){let name="message",parts=[],ping=false;for(const line of block.split("\n")){if(line.startsWith(":")){ping=true;continue;}if(line.startsWith("event:"))name=line.slice(6).trim();else if(line.startsWith("data:"))parts.push(line.slice(5).trimStart());}if(ping&&!parts.length){debugEvent(log,"ping",{comment:block},block);continue;}if(parts.length){let data;try{data=JSON.parse(parts.join("\n"));}catch{continue;}debugEvent(log,name,data,parts.join("\n"));await onEvent(name,data);}}}}
    async function sendMessage(text,retry=true){await ensureSession();active.history.push({role:"user",text});save();addBubble("user",text);const answer=addBubble("assistant","");const progress=document.createElement("div");progress.className="progress";progress.textContent="질문 이해 중...";answer.after(progress);setBusy(true);const started=performance.now(),url=`${active.base}/v1/sessions/${active.session.session_id}/messages`,requestHeaders=headers({accept:"text/event-stream"}),requestBody={message:text};let firstToken=null,doneData=null,streamError=null,tokenCount=0;const log=debugStart("POST",url,requestHeaders,requestBody,"sse");active.controller=new AbortController();lastRetry=()=>sendMessage(text);try{const response=await fetch(url,{method:"POST",headers:requestHeaders,body:JSON.stringify(requestBody),signal:active.controller.signal});if(response.status===404&&retry){const body=await response.clone().json().catch(()=>null);if(body?.error?.code==="DL_SESSION_NOT_FOUND"){debugFinish(log,{status:response.status,body},body);await createSession();answer.remove();progress.remove();active.history.pop();return sendMessage(text,false);}}await parseSse(response,async(name,data)=>{if(name==="start")progress.textContent="질문 이해 중...";if(name==="tool_call")progress.textContent=`[${safeText(data.tool)}] ${data.status==="started"?"조회 중...":"완료"}`;if(name==="token"){if(firstToken===null)firstToken=performance.now();tokenCount++;answer.append(document.createTextNode(safeText(data.text)));progress.textContent="응답 생성 중...";$("chatView").scrollTop=$("chatView").scrollHeight;}if(name==="dataset")loadDataset(data,answer);if(name==="error")streamError=data;if(name==="done")doneData=data;},log);if(streamError)throw Object.assign(new Error(streamError?.error?.code||"STREAM_ERROR"),{payload:streamError});if(!doneData)throw Object.assign(new Error("STREAM_INTERRUPTED"),{payload:{error:{code:"STREAM_INTERRUPTED",message:"Stream ended without done",retryable:true,details:null}}});const ttft=firstToken===null?null:firstToken-started,total=performance.now()-started,generation=Math.max(1,total-(ttft??total)),rate=tokenCount/(generation/1000);const metrics=document.createElement("div");metrics.className="metrics";metrics.textContent=`TTFT ${ttft===null?"—":(ttft/1000).toFixed(1)+"s"} · 총 ${((doneData?.metadata?.duration_ms||total)/1000).toFixed(1)}s · ${rate.toFixed(1)} tok/s · tool_calls=${doneData?.metadata?.tool_calls||0}`;answer.append(metrics);progress.remove();debugFinish(log,doneData);active.history.push({role:"assistant",text:answer.firstChild?.textContent||""});save();}catch(error){progress.remove();const partial=tokenCount>0||Boolean(answer.querySelector(".dataset"));if(partial){const badge=document.createElement("span");badge.className="interrupted";badge.textContent=error.name==="AbortError"?"응답을 취소했습니다":"응답이 중단되었습니다";answer.append(document.createElement("br"),badge);active.history.push({role:"assistant",text:answer.firstChild?.textContent||""});save();}else answer.remove();const payload=error.name==="AbortError"?{error:{code:"REQUEST_ABORTED",message:"Request aborted",retryable:true,details:null}}:error?.payload||{error:{code:error.message,message:error.message,retryable:true,details:null}};debugFinish(log,doneData,payload);if(error.name!=="AbortError")addError(error,lastRetry,partial);}finally{active.controller=null;setBusy(false);}}
    async function loadDataset(ref,anchor,offset=0){const id=ref.dataset_id;let model=active.datasets.find(item=>item.id===id);if(!model){model={id,rowCount:ref.row_count,columns:ref.columns||[],rows:[],offset:0};active.datasets.push(model);}try{const body=await api(`/v1/sessions/${active.session.session_id}/datasets/${encodeURIComponent(id)}/rows?offset=${offset}&limit=1000`);model.rows.push(...(body.rows||[]));model.offset=model.rows.length;renderDataset(model,anchor);}catch(error){addError(error,()=>loadDataset(ref,anchor,offset));}}
    function renderDataset(model,anchor){let box=document.querySelector(`[data-dataset="${CSS.escape(model.id)}"]`);if(!box){box=document.createElement("section");box.className="dataset";box.dataset.dataset=model.id;anchor.append(box);}const columns=model.columns.length?model.columns.map(c=>c.name):Object.keys(model.rows[0]||{});box.textContent="";const head=document.createElement("div");head.className="dataset-head";const title=document.createElement("b");title.textContent=model.id;const count=document.createElement("span");count.textContent=`${model.rows.length} / ${model.rowCount??model.rows.length}행`;head.append(title,count);box.append(head);const wrap=document.createElement("div");wrap.className="table-wrap";const table=document.createElement("table"),thead=document.createElement("thead"),tr=document.createElement("tr");columns.forEach(name=>{const th=document.createElement("th");th.textContent=name;tr.append(th);});thead.append(tr);table.append(thead);const tbody=document.createElement("tbody");model.rows.forEach(row=>{const tr=document.createElement("tr");columns.forEach(name=>{const td=document.createElement("td");td.textContent=safeText(row[name]);tr.append(td);});tbody.append(tr);});table.append(tbody);wrap.append(table);box.append(wrap);if(model.rowCount>model.rows.length){const more=document.createElement("button");more.className="pill more";more.textContent="더 보기";more.onclick=()=>loadDataset({dataset_id:model.id,row_count:model.rowCount,columns:model.columns},anchor,model.offset);box.append(more);}}
    async function showCatalog(){await ensureSession();$("chatView").classList.remove("active");$("catalogView").classList.add("active");try{const body=await api(`/v1/sessions/${active.session.session_id}/catalog/tables?limit=1000`);catalogRows=body.tables||[];renderCatalog();}catch(error){addError(error,showCatalog);showChat();}}
    function renderCatalog(){const needle=$("catalogSearch").value.casefold?$("catalogSearch").value.casefold():$("catalogSearch").value.toLocaleLowerCase();$("catalogList").textContent="";catalogRows.filter(row=>safeText(row.name).toLocaleLowerCase().includes(needle)).forEach(row=>{const wrap=document.createElement("div"),button=document.createElement("button");button.className="table-item";const name=document.createElement("span");name.textContent=row.name;button.append(name);if(row.partitioned){const badge=document.createElement("span");badge.className="badge";badge.textContent="partitioned";button.append(badge);}const columns=document.createElement("div");columns.className="columns";columns.hidden=true;button.onclick=()=>loadColumns(row.name,columns);wrap.append(button,columns);$("catalogList").append(wrap);});}
    async function loadColumns(table,target){if(!target.hidden){target.hidden=true;return;}target.hidden=false;target.textContent="컬럼 조회 중...";try{const body=await api(`/v1/sessions/${active.session.session_id}/catalog/tables/${encodeURIComponent(table)}/columns`);target.textContent="";const input=document.createElement("input");input.placeholder="컬럼 검색";input.className="pill";const list=document.createElement("div");const draw=()=>{const q=input.value.toLocaleLowerCase();list.textContent=(body.columns||[]).filter(c=>safeText(c.name).toLocaleLowerCase().includes(q)).map(c=>`${c.name} · ${c.type}`).join("\n");};input.oninput=draw;target.append(input,list);draw();}catch(error){target.textContent=errorMessages[error?.payload?.error?.code]||"컬럼을 불러오지 못했습니다.";}}
    function showChat(){$("catalogView").classList.remove("active");$("chatView").classList.add("active");}
    $("aiFab").onclick=async()=>{const open=$("panel").classList.toggle("open");$("aiFab").setAttribute("aria-expanded",open);if(open){if(!active.apiKey)openSettings();else try{await ensureSession();}catch{}}};$("closeBtn").onclick=()=>{$("panel").classList.remove("open");$("aiFab").setAttribute("aria-expanded","false")};$("settingsBtn").onclick=openSettings;$("modalCancel").onclick=()=>$("settingsDialog").close();
    $("settingsForm").onsubmit=async event=>{event.preventDefault();active.base=$("baseInput").value.replace(/\/$/,"");active.apiKey=$("keyInput").value;active.session=null;save();$("settingsDialog").close();try{await createSession();}catch(error){addError(error,openSettings);}};
    $("composer").onsubmit=event=>{event.preventDefault();const text=$("messageInput").value.trim();if(!text)return;$("messageInput").value="";sendMessage(text)};$("cancelBtn").onclick=()=>active.controller?.abort();$("newBtn").onclick=()=>newConversation().catch(error=>addError(error,newConversation));$("catalogBtn").onclick=showCatalog;$("backBtn").onclick=showChat;$("catalogSearch").oninput=renderCatalog;
    $("debugToggle").onclick=()=>{debugOpen=!debugOpen;$("debugConsole").classList.toggle("collapsed",!debugOpen);$("debugToggle").setAttribute("aria-expanded",debugOpen);$("debugToggle").textContent=`${debugOpen?"▾":"▸"} 디버그 콘솔`;debugSave();};$("copyLogs").onclick=copyLogs;$("clearLogs").onclick=()=>{debugLogs=[];debugSave();debugRender();};
    async function setLocale(locale){if(active.locale===locale)return;active.locale=locale;active.session=null;updateLocale();save();try{await createSession();}catch(error){addError(error,()=>setLocale(locale));}}$("koBtn").onclick=()=>setLocale("ko");$("jaBtn").onclick=()=>setLocale("ja");
    restore();if(!active.apiKey)openSettings();setInterval(updateExpiry,30000);
  })();
  </script>
