name: ${COMPOSE_PROJECT_NAME:-probe-poc}

services:
  queryforge:
    image: ${QUERYFORGE_IMAGE:-queryforge:local}
    build:
      context: ${QUERYFORGE_CONTEXT:-../QueryForge}
      dockerfile: Dockerfile
    container_name: pp-queryforge
    restart: unless-stopped
    # ── 설정은 그것을 쓰는 저장소가 소유한다 (2026-10-27 정리) ──────────
    #
    # 전에는 QueryForge 의 비밀까지 이 저장소의 `.env` 가 들고 있었다.
    # DataLens 는 QueryForge 를 **띄우기만** 하는데 남의 설정을 쥐고 있어서,
    # 값 하나를 바꾸려면 어느 파일인지부터 찾아야 했다. 실제로 pem 비번이
    # 네 자리에 흩어져 한 곳만 고친 채로 돌다가 `Access denied` 를 만났다.
    #
    #   `../QueryForge/.env`  QF 소유 — 비밀·클라이언트 맵. **혼자 띄울 때도 쓴다**
    #   `.env`                이 저장소 — DataLens 설정 + compose 레벨(이미지·포트)
    #
    # **2026-10-20 에 하나로 합쳤던 이유는 중복이었다.** 그때는 같은 변수
    # 7개가 양쪽에 **복사**돼 한쪽만 고치면 조용히 어긋났다. 지금은 복사가
    # 아니라 **참조**다 — 각 키가 한 파일에만 있어 그 사고가 재발하지 않는다.
    #
    # 순서가 의미를 갖는다: 뒤가 이긴다. 평소에는 겹치는 키가 없고, 상위가
    # 일부러 덮고 싶을 때만 `.env` 나 아래 `environment:` 에 적는다.
    env_file:
      - path: ../QueryForge/.env
        required: true
      - path: ${DATALENS_ENV_FILE:-.env}
        required: true
    environment:
      QUERYFORGE_HOST: 0.0.0.0
      QUERYFORGE_PORT: "8080"
      # ── 선언 파일을 쓴다 — **`.env` 에 맡기지 않는다** (2026-10-20) ────
      #
      # 이 변수가 없으면 QueryForge 는 `config/databases.yaml` 을 **아예 보지
      # 않고** `.env` 의 `DB_*` 한 묶음으로 단일 DB 를 만든다(레거시 경로,
      # `config/databases.py:declaration_path`). 선언 파일을 고쳐도 **아무 일도
      # 일어나지 않고 에러도 없다.**
      #
      # 현장 PoC 서버에서 실제로 그 상태였고, 거기서 compose 에 직접 적어
      # 해결했다 — 그 수정을 여기로 올린 것이다. `.env` 에 두면 환경을 새로
      # 깔 때마다 빠뜨릴 수 있고, 빠뜨린 것이 드러나지 않는다.
      #
      # 경로는 **컨테이너 안 경로**다. 아래 volumes 가 `config/` 디렉터리를
      # `/etc/queryforge` 로 마운트한다.
      QUERYFORGE_DATABASES_FILE: /etc/queryforge/databases.yaml
    volumes:
      # QueryForge 설정은 QueryForge 쪽이 소유한다. 디렉터리째 마운트해야 databases.yaml 이 보이고,
      # 편집기가 저장하며 inode 를 갈아끼워도 컨테이너가 새 내용을 본다(파일 하나만 바인드하면 못 본다).
      # 운영에서는 QUERYFORGE_CONFIG_DIR 로 리포 밖 경로를 가리킨다.
      - ${QUERYFORGE_CONFIG_DIR:-../QueryForge/config}:/etc/queryforge:ro
      - qf_state:/var/lib/queryforge
    ports:
      # ADR-011 — 외부 노출 금지. 기본 바인드 호스트를 127.0.0.1에서 올리지 않는다.
      - "${QUERYFORGE_BIND_HOST:-127.0.0.1}:${QUERYFORGE_BIND_PORT:-20001}:8080"
    # graphio-net 은 graphio-probe-rca/docker-compose.dev.yml 이 만든 외부
    # 네트워크다. 여기에 붙어야 DB_HOST=graphio-mysql 로 닿는다. DataLens 는
    # MySQL 에 직접 붙지 않으므로(QueryForge 경유) ppnet 만 있으면 된다.
    networks: [ppnet, graphio-net]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  datalens:
    image: ${DATALENS_IMAGE:-datalens:0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pp-datalens
    restart: unless-stopped
    env_file:
      - path: ${DATALENS_ENV_FILE:-.env}
        required: true
    depends_on:
      queryforge:
        condition: service_healthy
    extra_hosts:
      # 호스트에서 도는 Ollama에 붙는다.
      - "host.docker.internal:host-gateway"
    ports:
      - "${DATALENS_BIND_HOST:-127.0.0.1}:${DATALENS_BIND_PORT:-20005}:${DATALENS_HTTP_PORT:-8000}"
    volumes:
      # 학습한 성공 플랜과 용어 사전. 컨테이너를 다시 만들어도 남아야 한다.
      - datalens-memory:/var/lib/datalens
    networks: [ppnet]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('DATALENS_HTTP_PORT','8000')+'/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    stop_grace_period: 40s

networks:
  ppnet:
    driver: bridge
  # graphio 쪽 compose 가 먼저 떠 있어야 한다:
  #   cd ../graphio-probe-rca && docker compose -f docker-compose.dev.yml up -d
  graphio-net:
    external: true

volumes:
  datalens-memory:
  qf_state:
